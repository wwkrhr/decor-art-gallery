<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#2E6B5E">
<title>图册管理</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  background: #f4f5f7;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  color: #1f1f1f;
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
}
.nav {
  position: sticky; top: 0; z-index: 50;
  height: 44px; background: #2E6B5E; color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 500;
}
.wrap { padding: 12px; padding-bottom: 40px; }
.card {
  background: #fff; border-radius: 8px; padding: 14px; margin-bottom: 12px;
  box-shadow: 0 1px 4px rgba(0,0,0,.04);
}
.card h3 { margin: 0 0 12px; font-size: 15px; font-weight: 600; }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 13px; color: #666; margin-bottom: 6px; }
.field input, .field select {
  width: 100%; height: 42px; padding: 0 10px;
  border: 1px solid #e2e2e2; border-radius: 6px;
  font-size: 14px; background: #fff; color: #222;
  outline: none;
}
.field input:focus, .field select:focus { border-color: #2E6B5E; }
.field .hint { margin-top: 5px; font-size: 12px; color: #999; line-height: 1.5; }
.row2 { display: flex; gap: 10px; }
.row2 > * { flex: 1; min-width: 0; }
.btn {
  display: block; width: 100%; height: 44px; margin-top: 6px;
  border: none; border-radius: 8px;
  background: #2E6B5E; color: #fff;
  font-size: 15px; font-weight: 500;
}
.btn:disabled { background: #b9c9c4; }
.btn.orange { background: #E8622A; }
.btn.ghost { background: #fff; color: #555; border: 1px solid #e2e2e2; }
.btn.small { height: 36px; font-size: 13px; margin-top: 0; width: auto; padding: 0 14px; display: inline-block; }
.preview {
  width: 100%; height: 200px; margin-top: 10px;
  border-radius: 8px; background: #f2f3f5;
  object-fit: contain; display: none;
}
.preview.on { display: block; }
.pick {
  display: block; width: 100%; height: 44px; line-height: 42px;
  text-align: center; border: 1px dashed #c9d3cf; border-radius: 8px;
  color: #2E6B5E; font-size: 14px; background: #f8faf9;
}
.pick input { display: none; }
.status {
  position: fixed; left: 12px; right: 12px; bottom: 12px;
  padding: 12px 14px; border-radius: 8px;
  font-size: 13px; line-height: 1.5;
  background: #333; color: #fff;
  opacity: 0; transition: opacity .2s; pointer-events: none;
  z-index: 100;
}
.status.on { opacity: 1; }
.status.err { background: #b3261e; }
.status.ok { background: #2E6B5E; }
.lock { text-align: center; padding: 60px 20px; }
.lock .icon { font-size: 40px; }
.lock p { color: #777; font-size: 13px; line-height: 1.7; }
.tips {
  font-size: 12px; color: #888; line-height: 1.7;
  background: #fff8e8; border-radius: 8px; padding: 12px; margin-bottom: 12px;
}
.tips b { color: #a86b00; }
.list-item {
  display: flex; align-items: center; padding: 10px 0;
  border-bottom: 1px solid #f2f2f2; font-size: 13px;
}
.list-item:last-child { border-bottom: none; }
.list-item img { width: 44px; height: 44px; border-radius: 6px; object-fit: cover; margin-right: 10px; background: #f2f2f2; }
.list-item .body { flex: 1; min-width: 0; }
.list-item .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list-item .sub { color: #999; font-size: 12px; margin-top: 2px; }
</style>
</head>
<body>
<div class="nav">图册管理</div>
<div id="app"></div>
<div class="status" id="status"></div>

<script>
/* ===================================================================
   图册管理页 —— 直接往 GitHub 仓库提交图片和数据，零服务器
   =================================================================== */
(function () {
  var OWNER = 'wwkrhr'
  var REPO = 'decor-art-gallery'
  var BRANCH = 'main'
  var API = 'https://api.github.com/repos/' + OWNER + '/' + REPO + '/contents/'
  var TOKEN_KEY = 'zs_gh_token'
  var app = document.getElementById('app')
  var statusEl = document.getElementById('status')

  var state = {
    token: '',
    data: null,
    dataSha: '',
    picked: null
  }

  // ---------------- 工具 ----------------
  function toast(msg, type) {
    statusEl.textContent = msg
    statusEl.className = 'status on ' + (type || '')
    if (type !== 'err') {
      setTimeout(function () { statusEl.className = 'status' }, 3200)
    }
  }

  function utf8ToB64(str) {
    var bytes = new TextEncoder().encode(str)
    var bin = ''
    var CHUNK = 0x8000
    for (var i = 0; i < bytes.length; i += CHUNK) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK))
    }
    return btoa(bin)
  }

  function b64ToUtf8(b64) {
    var bin = atob(String(b64).replace(/\s/g, ''))
    var bytes = new Uint8Array(bin.length)
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i)
    return new TextDecoder().decode(bytes)
  }

  function headers() {
    return {
      Authorization: 'Bearer ' + state.token,
      Accept: 'application/vnd.github+json',
      'Content-Type': 'application/json'
    }
  }

  function ghGet(path) {
    return fetch(API + path + '?ref=' + BRANCH + '&t=' + Date.now(), { headers: headers() })
      .then(function (r) {
        if (r.status === 404) return null
        if (r.status === 401) throw new Error('Token 无效或已过期（401）')
        if (r.status === 403) throw new Error('Token 权限不够（403），需要 Contents 读写权限')
        if (!r.ok) throw new Error('读取失败 HTTP ' + r.status)
        return r.json()
      })
  }

  function ghPut(path, contentB64, message, sha) {
    var body = { message: message, content: contentB64, branch: BRANCH }
    if (sha) body.sha = sha
    return fetch(API + path, {
      method: 'PUT',
      headers: headers(),
      body: JSON.stringify(body)
    }).then(function (r) {
      return r.json().then(function (j) {
        if (!r.ok) throw new Error((j && j.message) || ('提交失败 HTTP ' + r.status))
        return j
      })
    })
  }

  function compress(file, maxSide, quality) {
    return new Promise(function (resolve, reject) {
      var img = new Image()
      img.onload = function () {
        var w = img.width
        var h = img.height
        var s = Math.min(1, maxSide / Math.max(w, h))
        w = Math.max(1, Math.round(w * s))
        h = Math.max(1, Math.round(h * s))
        var c = document.createElement('canvas')
        c.width = w
        c.height = h
        c.getContext('2d').drawImage(img, 0, 0, w, h)
        var dataUrl = c.toDataURL('image/jpeg', quality)
        resolve({ dataUrl: dataUrl, b64: dataUrl.split(',')[1], w: w, h: h })
        URL.revokeObjectURL(img.src)
      }
      img.onerror = function () { reject(new Error('图片读不出来')) }
      img.src = URL.createObjectURL(file)
    })
  }

  function parseData(txt) {
    var m = txt.match(/window\.ZS_DATA\s*=\s*([\s\S]*?);?\s*$/)
    if (!m) throw new Error('data.js 格式不对，找不到 ZS_DATA')
    return JSON.parse(m[1])
  }

  function buildDataJs(data) {
    return '// 自动生成。管理页会直接改这个文件。\nwindow.ZS_DATA = ' + JSON.stringify(data) + ';\n'
  }

  function nextCode(monthId) {
    var month = null
    for (var i = 0; i < state.data.months.length; i++) {
      if (state.data.months[i].id === monthId) { month = state.data.months[i]; break }
    }
    var digits = String(monthId).replace(/^m/, '')
    var prefix = /^\d{4}$/.test(digits) ? 'ZS-' + digits + '-' : 'ZS-' + String(Date.now()).slice(-4) + '-'
    var max = 0
    state.data.artworks.forEach(function (a) {
      if (a.monthId !== monthId) return
      var mm = String(a.code || '').match(/(\d+)$/)
      if (mm) {
        var n = parseInt(mm[1], 10)
        if (n > max) max = n
      }
    })
    return prefix + String(max + 1).padStart(3, '0')
  }

  // ---------------- 登录 ----------------
  function renderLock() {
    app.innerHTML =
      '<div class="lock">' +
      '<div class="icon">🔒</div>' +
      '<p>这里用来往图册里加图片和数据。<br>需要先填一个 GitHub 令牌。</p>' +
      '</div>' +
      '<div class="wrap" style="padding-top:0">' +
      '<div class="card">' +
      '<h3>第一步：填令牌</h3>' +
      '<div class="field">' +
      '<input id="tokenInput" type="password" placeholder="粘贴 ghp_ 或 github_pat_ 开头的令牌" autocomplete="off">' +
      '<div class="hint">只需要一次，会存在这台手机的浏览器里。</div>' +
      '</div>' +
      '<button class="btn" id="saveToken">保存并进入</button>' +
      '</div>' +
      '<div class="tips">' +
      '<b>没有令牌？</b>去 GitHub → Settings → Developer settings → Personal access tokens → ' +
      'Fine-grained tokens → Generate new token，只勾选这个仓库的 <b>Contents: Read and write</b>，' +
      '有效期选 90 天或 1 年。生成后复制那串以 ghp_ 或 github_pat_ 开头的字符。' +
      '</div>' +
      '</div>'

    document.getElementById('saveToken').onclick = function () {
      var v = (document.getElementById('tokenInput').value || '').trim()
      if (!v) { toast('令牌不能为空', 'err'); return }
      state.token = v
      localStorage.setItem(TOKEN_KEY, v)
      toast('已保存，正在读取数据…')
      boot()
    }
  }

  // ---------------- 主界面 ----------------
  function renderMain() {
    var catOptions = state.data.categories.map(function (c) {
      return '<option value="' + c.id + '">' + c.name + '</option>'
    }).join('')

    var monOptions = state.data.months.map(function (m) {
      return '<option value="' + m.id + '">' + m.name + '</option>'
    }).join('')

    app.innerHTML =
      '<div class="wrap">' +
      '<div class="tips">加完图等 <b>1 分钟</b>，线上就会自动更新。刷新前台页面就能看到。</div>' +

      '<div class="card">' +
      '<h3>加一张画芯</h3>' +
      '<div class="field">' +
      '<label>图片</label>' +
      '<label class="pick" for="file">点这里选图（会自动压缩）<input id="file" type="file" accept="image/*"></label>' +
      '<img class="preview" id="preview" alt="">' +
      '</div>' +
      '<div class="field">' +
      '<label>名称</label>' +
      '<input id="fName" placeholder="例：吉祥如意 金框横版">' +
      '</div>' +
      '<div class="row2">' +
      '<div class="field">' +
      '<label>分类</label>' +
      '<select id="fCat">' + catOptions + '</select>' +
      '</div>' +
      '<div class="field">' +
      '<label>月份</label>' +
      '<select id="fMon">' + monOptions + '</select>' +
      '</div>' +
      '</div>' +
      '<div class="row2">' +
      '<div class="field">' +
      '<label>规格</label>' +
      '<input id="fSpec" placeholder="120×60cm">' +
      '</div>' +
      '<div class="field">' +
      '<label>编号（自动生成）</label>' +
      '<input id="fCode" readonly>' +
      '</div>' +
      '</div>' +
      '<button class="btn orange" id="submitArt">保存画芯</button>' +
      '</div>' +

      '<div class="card">' +
      '<h3>加分类</h3>' +
      '<div class="field"><input id="newCat" placeholder="例：钟表系列"></div>' +
      '<button class="btn ghost" id="submitCat">添加分类</button>' +
      '</div>' +

      '<div class="card">' +
      '<h3>加月份</h3>' +
      '<div class="field"><input id="newMon" placeholder="例：26年1月更新"></div>' +
      '<button class="btn ghost" id="submitMon">添加月份</button>' +
      '</div>' +

      '<div class="card">' +
      '<h3>最近的画芯（' + state.data.artworks.length + ' 条）</h3>' +
      state.data.artworks.slice(0, 8).map(function (a) {
        return '<div class="list-item">' +
          '<img src="' + (a.thumb || a.cover || '') + '" alt="">' +
          '<div class="body"><div class="name">' + a.name + '</div>' +
          '<div class="sub">' + a.code + ' · ' + (a.categoryName || '') + '</div></div>' +
          '</div>'
      }).join('') +
      '</div>' +

      '<div class="card">' +
      '<button class="btn ghost" id="logout">换一个令牌</button>' +
      '</div>' +
      '</div>'

    var monSel = document.getElementById('fMon')
    var codeInput = document.getElementById('fCode')
    function refreshCode() {
      codeInput.value = nextCode(monSel.value)
    }
    monSel.onchange = refreshCode
    refreshCode()

    document.getElementById('file').onchange = function (e) {
      var f = e.target.files && e.target.files[0]
      if (!f) return
      toast('正在压缩图片…')
      compress(f, 1200, 0.82).then(function (res) {
        state.picked = res
        var p = document.getElementById('preview')
        p.src = res.dataUrl
        p.className = 'preview on'
        toast('图片已就绪（' + res.w + '×' + res.h + '）', 'ok')
      }).catch(function (err) {
        toast(err.message, 'err')
      })
    }

    document.getElementById('submitArt').onclick = submitArtwork
    document.getElementById('submitCat').onclick = submitCategory
    document.getElementById('submitMon').onclick = submitMonth
    document.getElementById('logout').onclick = function () {
      localStorage.removeItem(TOKEN_KEY)
      location.reload()
    }
  }

  // ---------------- 动作 ----------------
  var busy = false

  function submitArtwork() {
    if (busy) return
    var name = (document.getElementById('fName').value || '').trim()
    if (!state.picked) { toast('还没选图', 'err'); return }
    if (!name) { toast('还没填名称', 'err'); return }

    var catId = document.getElementById('fCat').value
    var monId = document.getElementById('fMon').value
    var cat = state.data.categories.filter(function (c) { return c.id === catId })[0] || {}
    var mon = state.data.months.filter(function (m) { return m.id === monId })[0] || {}
    var spec = (document.getElementById('fSpec').value || '').trim()
    var code = document.getElementById('fCode').value

    busy = true
    var btn = document.getElementById('submitArt')
    btn.disabled = true

    var fileName = 'assets/uploads/' + Date.now() + '-' + Math.floor(Math.random() * 1000) + '.jpg'
    var msg = '上传图片…'

    toast(msg)
    ghPut(fileName, state.picked.b64, '上传画芯图片 ' + name, null)
      .then(function () {
        toast('写入数据…')
        state.data.artworks.unshift({
          id: 'w' + String(Date.now()).slice(-8),
          code: code,
          name: name,
          categoryId: catId,
          categoryName: cat.name || '',
          monthId: monId,
          monthName: mon.name || '',
          spec: spec,
          cover: fileName,
          thumb: fileName,
          image: fileName,
          isNew: true,
          sort: 0,
          status: 1
        })
        return ghPut('data.js', utf8ToB64(buildDataJs(state.data)), '新增画芯：' + name, state.dataSha)
      })
      .then(function () {
        toast('已提交！等 1 分钟线上生效', 'ok')
        document.getElementById('fName').value = ''
        document.getElementById('fSpec').value = ''
        state.picked = null
        document.getElementById('preview').className = 'preview'
        boot()
      })
      .catch(function (err) {
        toast(err.message || '失败', 'err')
      })
      .then(function () {
        busy = false
        btn.disabled = false
      })
  }

  function submitCategory() {
    if (busy) return
    var name = (document.getElementById('newCat').value || '').trim()
    if (!name) { toast('填个分类名', 'err'); return }
    busy = true
    var id = 'c' + String(Date.now()).slice(-6)
    state.data.categories.push({
      id: id, name: name, cover: '', onHome: true,
      sort: state.data.categories.length + 1, status: 1
    })
    ghPut('data.js', utf8ToB64(buildDataJs(state.data)), '新增分类：' + name, state.dataSha)
      .then(function () {
        toast('已添加，等 1 分钟生效', 'ok')
        boot()
      })
      .catch(function (err) { toast(err.message, 'err') })
      .then(function () { busy = false })
  }

  function submitMonth() {
    if (busy) return
    var name = (document.getElementById('newMon').value || '').trim()
    if (!name) { toast('填个月刊名', 'err'); return }
    busy = true
    var id = 'm' + Date.now()
    state.data.months.push({
      id: id, name: name, count: 0, cover: '',
      sort: state.data.months.length + 1, status: 1
    })
    ghPut('data.js', utf8ToB64(buildDataJs(state.data)), '新增月份：' + name, state.dataSha)
      .then(function () {
        toast('已添加，等 1 分钟生效', 'ok')
        boot()
      })
      .catch(function (err) { toast(err.message, 'err') })
      .then(function () { busy = false })
  }

  // ---------------- 启动 ----------------
  function boot() {
    state.token = state.token || localStorage.getItem(TOKEN_KEY) || ''
    if (!state.token) { renderLock(); return }

    toast('读取数据…')
    ghGet('data.js')
      .then(function (res) {
        if (!res) throw new Error('仓库里找不到 data.js')
        state.dataSha = res.sha
        state.data = parseData(b64ToUtf8(res.content))
        renderMain()
        toast('就绪', 'ok')
      })
      .catch(function (err) {
        toast(err.message || '读取失败', 'err')
        if (String(err.message).indexOf('401') >= 0 || String(err.message).indexOf('403') >= 0) {
          localStorage.removeItem(TOKEN_KEY)
          state.token = ''
          renderLock()
        }
      })
  }

  boot()
})()
</script>
</body>
</html>
