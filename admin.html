<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#2E6B5E">
<title>图册管理</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  background: #f4f5f7;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  color: #1f1f1f;
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
}
.nav {
  position: sticky; top: 0; z-index: 50;
  height: 44px; background: #2E6B5E; color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 500;
}
.wrap { padding: 12px; padding-bottom: 40px; }
.tabs {
  display: flex; background: #fff; border-radius: 8px; overflow: hidden;
  margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.04);
}
.tabs div {
  flex: 1; text-align: center; padding: 12px 0; font-size: 14px; color: #666;
}
.tabs div.on { color: #E8622A; font-weight: 600; box-shadow: inset 0 -2px 0 #E8622A; }
.card {
  background: #fff; border-radius: 8px; padding: 14px; margin-bottom: 12px;
  box-shadow: 0 1px 4px rgba(0,0,0,.04);
}
.card h3 { margin: 0 0 12px; font-size: 15px; font-weight: 600; }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 13px; color: #666; margin-bottom: 6px; }
.field input, .field select {
  width: 100%; height: 42px; padding: 0 10px;
  border: 1px solid #e2e2e2; border-radius: 6px;
  font-size: 14px; background: #fff; color: #222; outline: none;
}
.field input:focus, .field select:focus { border-color: #2E6B5E; }
.field .hint { margin-top: 5px; font-size: 12px; color: #999; line-height: 1.5; }
.row2 { display: flex; gap: 10px; }
.row2 > * { flex: 1; min-width: 0; }
.btn {
  display: block; width: 100%; height: 44px; margin-top: 6px;
  border: none; border-radius: 8px;
  background: #2E6B5E; color: #fff;
  font-size: 15px; font-weight: 500;
}
.btn:disabled { background: #b9c9c4; }
.btn.orange { background: #E8622A; }
.btn.ghost { background: #fff; color: #555; border: 1px solid #e2e2e2; }
.btn.danger { background: #d9534f; }
.preview {
  width: 100%; height: 190px; margin-top: 10px;
  border-radius: 8px; background: #f2f3f5;
  object-fit: contain; display: none;
}
.preview.on { display: block; }
.pick {
  display: block; width: 100%; height: 44px; line-height: 42px;
  text-align: center; border: 1px dashed #c9d3cf; border-radius: 8px;
  color: #2E6B5E; font-size: 14px; background: #f8faf9;
}
.pick input { display: none; }
.status {
  position: fixed; left: 12px; right: 12px; bottom: 12px;
  padding: 12px 14px; border-radius: 8px;
  font-size: 13px; line-height: 1.5;
  background: #333; color: #fff;
  opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 100;
}
.status.on { opacity: 1; }
.status.err { background: #b3261e; }
.status.ok { background: #2E6B5E; }
.lock { text-align: center; padding: 60px 20px; }
.lock .icon { font-size: 40px; }
.lock p { color: #777; font-size: 13px; line-height: 1.7; }
.tips {
  font-size: 12px; color: #888; line-height: 1.7;
  background: #fff8e8; border-radius: 8px; padding: 12px; margin-bottom: 12px;
  word-break: break-word;
}
.tips b { color: #a86b00; }
.item {
  display: flex; align-items: center; padding: 10px 0;
  border-bottom: 1px solid #f2f2f2; font-size: 13px;
}
.item:last-child { border-bottom: none; }
.item img { width: 46px; height: 46px; border-radius: 6px; object-fit: cover; margin-right: 10px; background: #f2f2f2; flex-shrink: 0; }
.item .body { flex: 1; min-width: 0; }
.item .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .sub { color: #999; font-size: 12px; margin-top: 2px; }
.del {
  flex-shrink: 0; margin-left: 8px;
  padding: 6px 12px; border-radius: 6px;
  background: #fdecec; color: #d9534f; font-size: 12px;
}
.count-badge {
  display: inline-block; margin-left: 6px; padding: 1px 7px;
  border-radius: 10px; background: #eef2f1; color: #2E6B5E; font-size: 11px;
}
.empty { padding: 24px 0; text-align: center; color: #bbb; font-size: 13px; }
</style>
</head>
<body>
<div class="nav">图册管理</div>
<div id="app"></div>
<div class="status" id="status"></div>

<script>
(function () {
  var OWNER = 'wwkrhr'
  var REPO = 'decor-art-gallery'
  var BRANCH = 'main'
  var API = 'https://api.github.com/repos/' + OWNER + '/' + REPO + '/contents/'
  var TOKEN_KEY = 'zs_gh_token'
  var app = document.getElementById('app')
  var statusEl = document.getElementById('status')

  var state = {
    token: '',
    data: null,
    dataSha: '',
    picked: null,
    tab: 'art',
    busy: false
  }

  // ---------------- 工具 ----------------
  function toast(msg, type) {
    statusEl.textContent = msg
    statusEl.className = 'status on ' + (type || '')
    if (type !== 'err') setTimeout(function () { statusEl.className = 'status' }, 3200)
  }

  function utf8ToB64(str) {
    var bytes = new TextEncoder().encode(str)
    var bin = '', CHUNK = 0x8000
    for (var i = 0; i < bytes.length; i += CHUNK) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK))
    }
    return btoa(bin)
  }

  function b64ToUtf8(b64) {
    var bin = atob(String(b64).replace(/\s/g, ''))
    var bytes = new Uint8Array(bin.length)
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i)
    return new TextDecoder().decode(bytes)
  }

  function headers() {
    return {
      Authorization: 'Bearer ' + state.token,
      Accept: 'application/vnd.github+json',
      'Content-Type': 'application/json'
    }
  }

  function ghGet(path) {
    return fetch(API + path + '?ref=' + BRANCH + '&t=' + Date.now(), { headers: headers() })
      .then(function (r) {
        if (r.status === 404) return null
        if (r.status === 401) throw new Error('令牌无效或已过期（401）')
        if (r.status === 403) throw new Error('令牌权限不够（403）')
        if (!r.ok) throw new Error('读取失败 HTTP ' + r.status)
        return r.json()
      })
  }

  function ghPut(path, contentB64, message, sha) {
    var body = { message: message, content: contentB64, branch: BRANCH }
    if (sha) body.sha = sha
    return fetch(API + path, { method: 'PUT', headers: headers(), body: JSON.stringify(body) })
      .then(function (r) {
        return r.json().then(function (j) {
          if (!r.ok) throw new Error((j && j.message) || ('提交失败 HTTP ' + r.status))
          return j
        })
      })
  }

  function compress(file, maxSide, quality) {
    return new Promise(function (resolve, reject) {
      var img = new Image()
      img.onload = function () {
        var w = img.width, h = img.height
        var s = Math.min(1, maxSide / Math.max(w, h))
        w = Math.max(1, Math.round(w * s))
        h = Math.max(1, Math.round(h * s))
        var c = document.createElement('canvas')
        c.width = w; c.height = h
        c.getContext('2d').drawImage(img, 0, 0, w, h)
        var dataUrl = c.toDataURL('image/jpeg', quality)
        resolve({ dataUrl: dataUrl, b64: dataUrl.split(',')[1], w: w, h: h })
        URL.revokeObjectURL(img.src)
      }
      img.onerror = function () { reject(new Error('图片读不出来')) }
      img.src = URL.createObjectURL(file)
    })
  }

  function parseData(txt) {
    var m = txt.match(/window\.ZS_DATA\s*=\s*([\s\S]*?);?\s*$/)
    if (!m) throw new Error('data.js 格式不对')
    return JSON.parse(m[1])
  }

  function buildDataJs(data) {
    return '// 自动生成。管理页会直接改这个文件。\nwindow.ZS_DATA = ' + JSON.stringify(data) + ';\n'
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;')
  }

  // 图片路径：数据里可能是 /assets/xxx（以站点根为准），
  // 但本站挂在子目录下，必须去掉开头的斜杠才能找到
  function img(p) {
    if (!p) return ''
    return String(p).replace(/^\//, '')
  }

  function countByCategory(id) {
    return state.data.artworks.filter(function (a) { return a.categoryId === id }).length
  }

  function countByMonth(id) {
    return state.data.artworks.filter(function (a) { return a.monthId === id }).length
  }

  function nextCode(monthId) {
    var digits = String(monthId).replace(/^m/, '')
    var prefix = /^\d{4}$/.test(digits) ? 'ZS-' + digits + '-' : 'ZS-' + String(Date.now()).slice(-4) + '-'
    var max = 0
    state.data.artworks.forEach(function (a) {
      if (a.monthId !== monthId) return
      var mm = String(a.code || '').match(/(\d+)$/)
      if (mm) {
        var n = parseInt(mm[1], 10)
        if (n > max) max = n
      }
    })
    return prefix + String(max + 1).padStart(3, '0')
  }

  // 提交 data.js
  function saveData(message) {
    return ghPut('data.js', utf8ToB64(buildDataJs(state.data)), message, state.dataSha)
      .then(function (res) {
        if (res && res.content && res.content.sha) state.dataSha = res.content.sha
        toast('已提交，等 1 分钟线上生效', 'ok')
        return res
      })
  }

  // ---------------- 登录 ----------------
  function renderLock() {
    app.innerHTML =
      '<div class="lock"><div class="icon">🔒</div>' +
      '<p>这里用来往图册里加图片、建分类。<br>需要先填一个 GitHub 令牌。</p></div>' +
      '<div class="wrap" style="padding-top:0">' +
      '<div class="card"><h3>第一步：填令牌</h3>' +
      '<div class="field">' +
      '<input id="tokenInput" type="password" placeholder="粘贴 github_pat_ 开头的令牌" autocomplete="off">' +
      '<div class="hint">只需要一次，存在这台手机的浏览器里。</div></div>' +
      '<button class="btn" id="saveToken">保存并进入</button></div>' +
      '<div class="tips"><b>令牌怎么来：</b>GitHub → Settings → Developer settings → Personal access tokens → ' +
      'Fine-grained tokens → Generate new token，只勾这个仓库的 <b>Contents: Read and write</b>。</div>' +
      '</div>'

    document.getElementById('saveToken').onclick = function () {
      var v = (document.getElementById('tokenInput').value || '').trim()
      if (!v) { toast('令牌不能为空', 'err'); return }
      state.token = v
      localStorage.setItem(TOKEN_KEY, v)
      boot()
    }
  }

  // ---------------- 主界面 ----------------
  function renderMain() {
    var d = state.data
    var tabs = '<div class="tabs">' +
      tabBtn('art', '画芯 ' + d.artworks.length) +
      tabBtn('cat', '分类 ' + d.categories.length) +
      tabBtn('mon', '月份 ' + d.months.length) +
      '</div>'

    var body = ''
    if (state.tab === 'art') body = renderArtTab()
    else if (state.tab === 'cat') body = renderCatTab()
    else body = renderMonTab()

    app.innerHTML = '<div class="wrap">' + tabs + body + '</div>'
    bindTab()
    if (state.tab === 'art') bindArt()
    if (state.tab === 'cat') bindCat()
    if (state.tab === 'mon') bindMon()
    bindDeletes()
  }

  function tabBtn(key, label) {
    return '<div class="' + (state.tab === key ? 'on' : '') + '" data-tab="' + key + '">' + label + '</div>'
  }

  function bindTab() {
    var els = app.querySelectorAll('[data-tab]')
    for (var i = 0; i < els.length; i++) {
      els[i].onclick = function () {
        state.tab = this.getAttribute('data-tab')
        renderMain()
      }
    }
  }

  // ---------- 画芯 ----------
  function renderArtTab() {
    var d = state.data
    var catOptions = d.categories.map(function (c) {
      return '<option value="' + c.id + '">' + esc(c.name) + '</option>'
    }).join('')
    var monOptions = d.months.map(function (m) {
      return '<option value="' + m.id + '">' + esc(m.name) + '</option>'
    }).join('')

    var list = d.artworks.map(function (a) {
      return '<div class="item">' +
        '<img src="' + esc(img(a.thumb || a.cover || a.image || '')) + '" loading="lazy" alt="">' +
        '<div class="body"><div class="name">' + esc(a.name) + '</div>' +
        '<div class="sub">' + esc(a.code) + ' · ' + esc(a.categoryName || '未分类') + ' · ' + esc(a.monthName || '') + '</div></div>' +
        '<div class="del" data-del="art" data-id="' + esc(a.id) + '">删除</div></div>'
    }).join('') || '<div class="empty">还没有画芯</div>'

    return '<div class="tips">加完等 <b>1 分钟</b>线上生效，刷新前台就能看到。</div>' +
      '<div class="card"><h3>加一张画芯</h3>' +
      '<div class="field"><label>图片</label>' +
      '<label class="pick" for="file">点这里选图（自动压缩）<input id="file" type="file" accept="image/*"></label>' +
      '<img class="preview" id="preview" alt=""></div>' +
      '<div class="field"><label>名称</label><input id="fName" placeholder="例：吉祥如意 金框横版"></div>' +
      '<div class="row2">' +
      '<div class="field"><label>分类</label><select id="fCat">' + catOptions + '</select></div>' +
      '<div class="field"><label>月份</label><select id="fMon">' + monOptions + '</select></div>' +
      '</div>' +
      '<div class="row2">' +
      '<div class="field"><label>规格</label><input id="fSpec" placeholder="120×60cm"></div>' +
      '<div class="field"><label>编号（自动）</label><input id="fCode" readonly></div>' +
      '</div>' +
      '<button class="btn orange" id="submitArt">保存画芯</button></div>' +
      '<div class="card"><h3>全部画芯</h3>' + list + '</div>'
  }

  function bindArt() {
    var monSel = document.getElementById('fMon')
    var codeInput = document.getElementById('fCode')
    function refreshCode() { codeInput.value = nextCode(monSel.value) }
    if (monSel) {
      monSel.onchange = refreshCode
      refreshCode()
    }
    var fileInput = document.getElementById('file')
    if (fileInput) {
      fileInput.onchange = function (e) {
        var f = e.target.files && e.target.files[0]
        if (!f) return
        toast('压缩中…')
        compress(f, 1200, 0.82).then(function (res) {
          state.picked = res
          var p = document.getElementById('preview')
          p.src = res.dataUrl
          p.className = 'preview on'
          toast('图片就绪 ' + res.w + '×' + res.h, 'ok')
        }).catch(function (err) { toast(err.message, 'err') })
      }
    }
    var submit = document.getElementById('submitArt')
    if (submit) submit.onclick = submitArtwork
  }

  function submitArtwork() {
    if (state.busy) return
    var name = (document.getElementById('fName').value || '').trim()
    if (!state.picked) { toast('还没选图', 'err'); return }
    if (!name) { toast('还没填名称', 'err'); return }

    var catId = document.getElementById('fCat').value
    var monId = document.getElementById('fMon').value
    var cat = state.data.categories.filter(function (c) { return c.id === catId })[0] || {}
    var mon = state.data.months.filter(function (m) { return m.id === monId })[0] || {}
    var spec = (document.getElementById('fSpec').value || '').trim()
    var code = document.getElementById('fCode').value

    state.busy = true
    var btn = document.getElementById('submitArt')
    btn.disabled = true
    var fileName = 'assets/uploads/' + Date.now() + '-' + Math.floor(Math.random() * 1000) + '.jpg'

    toast('上传图片…')
    ghPut(fileName, state.picked.b64, '上传图片 ' + name, null)
      .then(function () {
        toast('写入数据…')
        state.data.artworks.unshift({
          id: 'w' + String(Date.now()).slice(-8),
          code: code, name: name,
          categoryId: catId, categoryName: cat.name || '',
          monthId: monId, monthName: mon.name || '',
          spec: spec,
          cover: fileName, thumb: fileName, image: fileName,
          isNew: true, sort: 0, status: 1
        })
        return saveData('新增画芯：' + name)
      })
      .then(function () {
        state.picked = null
        renderMain()
      })
      .catch(function (err) { toast(err.message || '失败', 'err') })
      .then(function () { state.busy = false; if (btn) btn.disabled = false })
  }

  // ---------- 分类 ----------
  function renderCatTab() {
    var list = state.data.categories.map(function (c) {
      var n = countByCategory(c.id)
      return '<div class="item">' +
        '<div class="body"><div class="name">' + esc(c.name) +
        '<span class="count-badge">' + n + ' 张</span></div>' +
        '<div class="sub">' + c.id + (c.onHome === false ? ' · 只在分类页显示' : ' · 首页显示') + '</div></div>' +
        '<div class="del" data-del="cat" data-id="' + esc(c.id) + '">删除</div></div>'
    }).join('') || '<div class="empty">还没有分类</div>'

    return '<div class="card"><h3>加分类</h3>' +
      '<div class="field"><input id="newCat" placeholder="例：钟表系列"></div>' +
      '<button class="btn ghost" id="submitCat">添加</button></div>' +
      '<div class="card"><h3>全部分类（' + state.data.categories.length + '）</h3>' + list + '</div>'
  }

  function bindCat() {
    var btn = document.getElementById('submitCat')
    if (!btn) return
    btn.onclick = function () {
      if (state.busy) return
      var name = (document.getElementById('newCat').value || '').trim()
      if (!name) { toast('填个分类名', 'err'); return }
      state.busy = true
      state.data.categories.push({
        id: 'c' + String(Date.now()).slice(-6),
        name: name, cover: '', onHome: true,
        sort: state.data.categories.length + 1, status: 1
      })
      saveData('新增分类：' + name)
        .then(function () { renderMain() })
        .catch(function (e) { toast(e.message, 'err') })
        .then(function () { state.busy = false })
    }
  }

  // ---------- 月份 ----------
  function renderMonTab() {
    var list = state.data.months.map(function (m) {
      var n = countByMonth(m.id)
      return '<div class="item">' +
        '<div class="body"><div class="name">' + esc(m.name) +
        '<span class="count-badge">' + n + ' 张</span></div>' +
        '<div class="sub">' + m.id + '</div></div>' +
        '<div class="del" data-del="mon" data-id="' + esc(m.id) + '">删除</div></div>'
    }).join('') || '<div class="empty">还没有月份</div>'

    return '<div class="card"><h3>加月份</h3>' +
      '<div class="field"><input id="newMon" placeholder="例：26年1月更新"></div>' +
      '<button class="btn ghost" id="submitMon">添加</button></div>' +
      '<div class="card"><h3>全部月份（' + state.data.months.length + '）</h3>' + list + '</div>'
  }

  function bindMon() {
    var btn = document.getElementById('submitMon')
    if (!btn) return
    btn.onclick = function () {
      if (state.busy) return
      var name = (document.getElementById('newMon').value || '').trim()
      if (!name) { toast('填个月刊名', 'err'); return }
      state.busy = true
      state.data.months.push({
        id: 'm' + Date.now(), name: name, count: 0, cover: '',
        sort: state.data.months.length + 1, status: 1
      })
      saveData('新增月份：' + name)
        .then(function () { renderMain() })
        .catch(function (e) { toast(e.message, 'err') })
        .then(function () { state.busy = false })
    }
  }

  // ---------- 删除 ----------
  function bindDeletes() {
    var els = app.querySelectorAll('[data-del]')
    for (var i = 0; i < els.length; i++) {
      els[i].onclick = function () {
        if (state.busy) return
        var kind = this.getAttribute('data-del')
        var id = this.getAttribute('data-id')
        doDelete(kind, id)
      }
    }
  }

  function doDelete(kind, id) {
    var d = state.data

    if (kind === 'art') {
      var art = d.artworks.filter(function (a) { return a.id === id })[0]
      if (!art) return
      if (!confirm('删除「' + art.name + '」？\n删除后客户那边也会消失。')) return
      state.busy = true
      d.artworks = d.artworks.filter(function (a) { return a.id !== id })
      saveData('删除画芯：' + art.name)
        .then(function () { renderMain() })
        .catch(function (e) { toast(e.message, 'err') })
        .then(function () { state.busy = false })
      return
    }

    if (kind === 'cat') {
      var cat = d.categories.filter(function (c) { return c.id === id })[0]
      if (!cat) return
      var n = countByCategory(id)
      var msg = n > 0
        ? '「' + cat.name + '」下面有 ' + n + ' 张画芯。\n删除分类会把这些画芯一起删掉，确定吗？'
        : '删除分类「' + cat.name + '」？'
      if (!confirm(msg)) return
      state.busy = true
      d.artworks = d.artworks.filter(function (a) { return a.categoryId !== id })
      d.categories = d.categories.filter(function (c) { return c.id !== id })
      saveData('删除分类：' + cat.name)
        .then(function () { renderMain() })
        .catch(function (e) { toast(e.message, 'err') })
        .then(function () { state.busy = false })
      return
    }

    if (kind === 'mon') {
      var mon = d.months.filter(function (m) { return m.id === id })[0]
      if (!mon) return
      var n2 = countByMonth(id)
      var msg2 = n2 > 0
        ? '「' + mon.name + '」下面有 ' + n2 + ' 张画芯。\n删除月份会把这些画芯一起删掉，确定吗？'
        : '删除月份「' + mon.name + '」？'
      if (!confirm(msg2)) return
      state.busy = true
      d.artworks = d.artworks.filter(function (a) { return a.monthId !== id })
      d.months = d.months.filter(function (m) { return m.id !== id })
      saveData('删除月份：' + mon.name)
        .then(function () { renderMain() })
        .catch(function (e) { toast(e.message, 'err') })
        .then(function () { state.busy = false })
    }
  }

  // ---------------- 启动 ----------------
  function boot() {
    state.token = state.token || localStorage.getItem(TOKEN_KEY) || ''
    if (!state.token) { renderLock(); return }
    toast('读取数据…')
    ghGet('data.js')
      .then(function (res) {
        if (!res) throw new Error('仓库里找不到 data.js')
        state.dataSha = res.sha
        state.data = parseData(b64ToUtf8(res.content))
        if (!state.data.artworks) state.data.artworks = []
        if (!state.data.categories) state.data.categories = []
        if (!state.data.months) state.data.months = []
        renderMain()
        toast('就绪', 'ok')
      })
      .catch(function (err) {
        toast(err.message || '读取失败', 'err')
        if (String(err.message).indexOf('401') >= 0) {
          localStorage.removeItem(TOKEN_KEY)
          state.token = ''
          renderLock()
        }
      })
  }

  boot()
})()
</script>
</body>
</html>
